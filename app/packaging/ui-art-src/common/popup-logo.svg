    <pattern id="hatch" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(-62)">
      <rect width="9" height="9" fill="#fff"/><rect width="2.4" height="9" fill="#000"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset=".5" stop-color="#000"/><stop offset=".86" stop-color="#fff"/></linearGradient>
    <mask id="fadeMask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="445"><rect width="512" height="445" fill="url(#fade)"/></mask>
    <mask id="legs" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="445">
      <rect width="512" height="445" fill="#fff"/>
      <rect width="512" height="445" fill="url(#hatch)" mask="url(#fadeMask)"/>
      <g transform="rotate(-9 256 300)"><path d="M34 300 C110 372 402 372 478 300" fill="none" stroke="#000" stroke-width="30"/></g>
    </mask>
  </defs>
  <g transform="scale(0.773438)" fill="#f0f0f0" fill-opacity=".47">
