      <path d="M34 300 C110 372 402 372 478 300"/><path d="M34 300 C62 270 112 250 164 243"/><path d="M348 243 C400 250 450 270 478 300"/>
    </g></g>
    <path d="M256 18 L440 380 L362 380 L256 168 L150 380 L72 380 Z" fill="none" stroke="#f0f0f0" stroke-opacity=".47" stroke-width="3"/>
    <path d="M6 62 V8 H60 M452 8 H506 V62 M6 382 V437 H60 M452 437 H506 V382" fill="none" stroke="#f0f0f0" stroke-opacity=".47" stroke-width="4"/>
    <text x="256" y="429" text-anchor="middle" font-family="Avenir Next, Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="27" letter-spacing="7">AGENTIC COMPLEX</text>
  </g>
