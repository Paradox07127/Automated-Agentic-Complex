    <path d="M256 250 L288 282 L256 314 L224 282 Z"/>
    <g transform="rotate(-9 256 300)" fill="none" stroke="#FFF100" stroke-width="11">
      <path d="M34 300 C110 372 402 372 478 300"/><path d="M34 300 C62 270 112 250 164 243"/><path d="M348 243 C400 250 450 270 478 300"/>
    </g>
    <path d="M6 62 V8 H60 M452 8 H506 V62 M6 382 V437 H60 M452 437 H506 V382" fill="none" stroke="#FFF100" stroke-width="5"/></g>
